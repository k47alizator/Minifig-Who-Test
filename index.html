<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Frozen Who</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --steel-blue: #385c80;
            --ice-blue: #d1e8ff;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(rgba(10, 15, 25, 0.9), rgba(10, 15, 25, 0.9)), url('img/tlo%20gry%202.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        /* LOGO */
        h1 { font-size: 5rem; margin-bottom: 30px; letter-spacing: 2px; text-transform: uppercase; }
        .frozen { color: var(--ice-blue); text-shadow: 0 0 10px rgba(209, 232, 255, 0.5); }
        .who { color: #5a8cc0; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

        /* MENU */
        .menu-box {
            background: rgba(56, 92, 128, 0.2);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 30px;
            border: 2px solid var(--ice-blue);
            width: 350px;
            text-align: center;
        }

        .menu-box h2 { color: var(--ice-blue); margin-bottom: 25px; }

        /* PRZYCISKI POZIOMÓW */
        .diff-buttons { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }

        .btn-diff {
            padding: 15px;
            border: 2px solid var(--ice-blue);
            border-radius: 10px;
            background: var(--ice-blue);
            color: var(--steel-blue);
            font-family: 'Fredoka', sans-serif;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* REAKCJA NA NAJECHANIE (Hover) */
        .btn-diff:hover {
            background: #a9c5e0; /* Nieco ciemniejszy błękit przy najechaniu */
            transform: scale(1.02);
        }

        /* KLASA AKTYWNA (Kliknięty) */
        .btn-diff.clicked {
            background: var(--steel-blue) !important;
            color: var(--ice-blue) !important;
            border-color: var(--ice-blue);
            transform: scale(0.98);
        }

        /* PRZYCISK KONTYNUUJ */
        .continue-btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            color: var(--ice-blue);
            border: 2px solid var(--ice-blue);
            border-radius: 10px;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .continue-btn:hover { background: var(--ice-blue); color: var(--steel-blue); }

        /* DISCORD */
        .discord-corner {
            position: fixed; top: 20px; right: 20px; width: 60px; height: 60px;
            background: var(--steel-blue); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 2000; transition: 0.3s; border: 2px solid var(--ice-blue);
        }
        .discord-corner:hover { background: var(--ice-blue); }
        .discord-corner:hover img { filter: invert(1); }
        .discord-corner img { width: 60%; transition: 0.3s; }

        footer { position: fixed; bottom: 20px; font-size: 11px; color: var(--ice-blue); opacity: 0.5; }
    </style>
</head>
<body>

    <div class="discord-corner" onclick="window.open('https://discord.gg/FeBT9tVEsY', '_blank')">
        <img src="img/Discord.webp" alt="Discord" onerror="this.src='https://cdn.prod.website-files.com/6257adef93867e50d84d30e2/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png'">
    </div>

    <h1>
        <span class="frozen">Frozen</span> 
        <span class="who">Who</span>
    </h1>

    <div class="menu-box">
        <h2>Poziom trudności</h2>
        
        <div class="diff-buttons">
            <button class="btn-diff" onclick="selectMode(this, 'easy')">Easy</button>
            <button class="btn-diff" onclick="selectMode(this, 'medium')">Medium</button>
            <button class="btn-diff" onclick="selectMode(this, 'hard')">Hard</button>
        </div>

        <button class="continue-btn" onclick="continueGame()">Kontynuuj</button>
    </div>

    <footer>
        Niniejsza strona jest projektem fanowskim. Gra nie jest powiązana z Grupą LEGO.
    </footer>

    <script>
        let selectedMode = null;

        function selectMode(element, mode) {
            // Usuwamy klasę 'clicked' ze wszystkich przycisków
            document.querySelectorAll('.btn-diff').forEach(btn => {
                btn.classList.remove('clicked');
            });
            
            // Dodajemy klasę 'clicked' tylko do tego, który kliknąłeś
            element.classList.add('clicked');
            
            // Zapisujemy tryb
            selectedMode = mode;
        }

        function continueGame() {
            if(!selectedMode) {
                alert("Wybierz najpierw poziom trudności!");
                return;
            }
            alert("Rozpoczynamy grę w trybie: " + selectedMode);
        }
    </script>
</body>
</html>
