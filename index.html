<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Frozen Who</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --steel-blue: #385c80; --ice-blue: #d1e8ff; }
        
        body { font-family: 'Fredoka', sans-serif; background: linear-gradient(rgba(10, 15, 25, 0.8), rgba(10, 15, 25, 0.8)), url('img/tlo%20gry%202.webp'); background-size: cover; background-position: center; background-attachment: fixed; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        
        @keyframes slowFloat { 0% { transform: translateY(0px); } 50% { transform: translateY(-8px); } 100% { transform: translateY(0px); } }
        h1 { font-size: 5rem; margin-bottom: 50px; letter-spacing: 2px; text-transform: uppercase; text-align: center; z-index: 10; }
        .frozen { font-family: 'Mountains of Christmas', cursive; background: linear-gradient(180deg, #FFFFFF 0%, #AEEEEE 50%, #70A1FF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0px 0px 5px rgba(255, 255, 255, 0.5)); margin-right: 15px; display: inline-block; animation: slowFloat 4s ease-in-out infinite; }
        .who { color: var(--ice-blue); text-shadow: 2px 2px 4px rgba(0,0,0,0.5); font-weight: 700; }

        .menu-box { background: rgba(56, 92, 128, 0.2); backdrop-filter: blur(15px); padding: 40px; border-radius: 30px; border: 2px solid var(--ice-blue); width: 350px; text-align: center; margin-bottom: 20px; z-index: 10; }
        
        .btn-diff { padding: 15px; margin: 8px 0; cursor: pointer; border: 2px solid var(--ice-blue); border-radius: 10px; background: var(--ice-blue); color: var(--steel-blue); font-weight: 700; font-size: 1.1rem; font-family: 'Fredoka', sans-serif; transition: 0.3s; width: 100%; box-sizing: border-box; }
        .btn-diff.clicked { background: var(--steel-blue) !important; color: white !important; }
        .btn-diff:hover { background: white; transform: scale(1.05); box-shadow: 0px 0px 15px rgba(209, 232, 255, 0.5); }
        
        #game-board { display: none; flex-direction: row; gap: 40px; background: rgba(56, 92, 128, 0.4); backdrop-filter: blur(15px); padding: 40px; border-radius: 30px; border: 2px solid var(--ice-blue); max-width: 900px; width: 90%; z-index: 10; }
        
        .left-side { flex: 1; display: flex; align-items: center; justify-content: center; }
        #image-container { width: 320px; height: 320px; background: rgba(10, 15, 25, 0.6); border-radius: 20px; border: 4px solid var(--ice-blue); display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #minifig-image { width: 90%; height: 90%; object-fit: contain; transition: filter 0.5s; }
        
        .right-side { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 15px; }
        
        .input-group { position: relative; width: 100%; }
        #guess-input { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid var(--ice-blue); background: white; color: var(--steel-blue); cursor: pointer; font-family: 'Fredoka', sans-serif; font-weight: bold; font-size: 1.1rem; box-sizing: border-box; outline: none; }
        #category-menu { display: none; position: absolute; background: white; color: var(--steel-blue); border-radius: 10px; width: 100%; cursor: pointer; border: 2px solid var(--ice-blue); z-index: 100; margin-top: 5px; max-height: 200px; overflow-y: auto; box-sizing: border-box; font-weight: bold; }
        .menu-item { padding: 12px; border-bottom: 1px solid #eee; transition: background 0.2s; }
        .menu-item:hover { background: var(--ice-blue); }
        
        .stat-text { color: white; font-size: 1.3rem; margin: 0; font-weight: bold; }
        .stat-text span { color: var(--ice-blue); }
        
        /* Miejsce na Twój komunikat zamiast wyskakującego okienka */
        #game-message { min-height: 25px; font-weight: bold; font-size: 1.2rem; text-align: center; margin: 5px 0; text-shadow: 0px 0px 10px rgba(0,0,0,0.8); }

        .discord-corner { position: fixed; top: 20px; right: 20px; width: 60px; height: 60px; background: rgba(56, 92, 128, 0.5); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid var(--ice-blue); backdrop-filter: blur(5px); transition: 0.3s; z-index: 1000; }
        .discord-corner:hover { transform: scale(1.1); background: var(--steel-blue); }
        .discord-corner img { width: 60%; }
        
        footer { position: fixed; bottom: 20px; font-size: 12px; color: var(--ice-blue); opacity: 0.5; text-align: center; width: 100%; pointer-events: none; z-index: 5; }
    </style>
</head>
<body>

    <div class="discord-corner" onclick="window.open('https://discord.gg/FeBT9tVEsY', '_blank')">
        <img src="img/Discord.webp" alt="Discord">
    </div>

    <h1 id="main-title">
        <span class="frozen">Frozen</span> 
        <span class="who">Who</span>
    </h1>

    <div class="menu-box" id="menu">
        <h2 style="margin-top: 0;">Poziom trudności</h2>
        <button class="btn-diff" onclick="selectMode(this, 'easy')">Easy</button>
        <button class="btn-diff" onclick="selectMode(this, 'medium')">Medium</button>
        <button class="btn-diff" onclick="selectMode(this, 'hard')">Hard</button>
        <div style="margin-top: 20px;">
            <button class="btn-diff" style="background: transparent; color: var(--ice-blue);" onclick="continueGame()">Kontynuuj</button>
        </div>
    </div>

    <div id="game-board">
        <div class="left-side">
            <div id="image-container">
                <img id="minifig-image" src="" alt="Postać">
            </div>
        </div>
        <div class="right-side">
            <p class="stat-text">Poziom: <span id="stat-mode">-</span></p>
            <p class="stat-text">Szanse: <span id="stat-lives">❤️❤️❤️❤️❤️</span></p>
            
            <div class="input-group">
                <input type="text" id="guess-input" placeholder="Wybierz serię..." readonly onclick="toggleMenu()">
                <div id="category-menu"></div>
            </div>
            
            <div id="game-message"></div>
            
            <button class="btn-diff" onclick="checkGuess()">ZGADUJ!</button>
        </div>
    </div>

    <footer>Niniejsza strona jest projektem fanowskim. Gra nie jest powiązana z Grupą LEGO.</footer>

const allCharacters = Object.entries(characters).flatMap(([cat, list]) => 
            list.map(char => ({ ...char, category: cat }))
        );

        let selectedMode = null;
        let currentAnswer = null;
        let lives = 5;
        
        // Zoptymalizowane poziomy rozmycia (piksele). 35 to już bardzo mocne rozmycie!
        const blurLevels = [35, 25, 15, 8, 3]; 
        let currentAttempt = 0;

        function selectMode(element, mode) {
            document.querySelectorAll('.menu-box .btn-diff').forEach(btn => btn.classList.remove('clicked'));
            element.classList.add('clicked');
            selectedMode = mode;
        }

        function toggleMenu() {
            const menu = document.getElementById('category-menu');
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        }

        function selectCategory(cat) {
            document.getElementById('guess-input').value = cat;
            toggleMenu();
        }

        function generateCategories() {
            const menu = document.getElementById('category-menu');
            menu.innerHTML = ''; 
            Object.keys(characters).forEach(categoryName => {
                menu.innerHTML += `<div class="menu-item" onclick="selectCategory('${categoryName}')">${categoryName}</div>`;
            });
        }

        function displayMessage(text, isError = false) {
            const msgBox = document.getElementById('game-message');
            msgBox.innerText = text;
            msgBox.style.color = isError ? "#ff6b6b" : "var(--ice-blue)"; // Czerwony dla błędu, niebieski dla sukcesu
        }

        function continueGame() {
            if(!selectedMode) { 
                displayMessage("Wybierz poziom trudności przed kontynuacją!", true);
                // Przenosimy komunikat tymczasowo pod przyciski, jeśli użytkownik nie wszedł do gry
                const menu = document.getElementById('menu');
                if(!document.getElementById('temp-msg')) {
                    menu.innerHTML += `<p id="temp-msg" style="color:#ff6b6b; font-weight:bold; margin-top:10px;">Wybierz poziom!</p>`;
                }
                return; 
            }
            
            document.getElementById('menu').style.display = 'none';
            document.getElementById('main-title').style.display = 'none';
            document.getElementById('game-board').style.display = 'flex';
            
            document.getElementById('stat-mode').innerText = selectedMode.toUpperCase();
            
            generateCategories(); 
            showRandomCharacter(); 
        }

        function updateLivesDisplay() {
            document.getElementById('stat-lives').innerText = '❤️'.repeat(lives);
        }

        function showRandomCharacter() {
            lives = 5;
            currentAttempt = 0;
            updateLivesDisplay();
            document.getElementById('guess-input').value = ""; 
            displayMessage(""); // Czyszczenie komunikatu

            const pool = (selectedMode === 'easy') 
                ? allCharacters.filter(c => c.isMain === true) 
                : allCharacters;
                
            currentAnswer = pool[Math.floor(Math.random() * pool.length)];
            
            const cleanName = currentAnswer.n.toLowerCase()
                                .replace(/[()]/g, '') 
                                .replace(/\s+/g, '_');
                                
            const imgElement = document.getElementById('minifig-image');
            imgElement.src = `img/${cleanName}.webp`;
            imgElement.style.filter = `blur(${blurLevels[currentAttempt]}px)`; 
        }

        function checkGuess() {
            const userGuess = document.getElementById('guess-input').value;
            
            if (!userGuess) {
                displayMessage("Najpierw wybierz serię z listy!", true);
                return;
            }

            if (userGuess === currentAnswer.category) {
                document.getElementById('minifig-image').style.filter = "blur(0px)"; // Odkrywamy postać
                displayMessage("Brawo! Zgadłeś z " + lives + " szansami na koncie!");
                
                // Czekamy 2 sekundy, żebyś mógł nacieszyć oczy ostrą postacią, i losujemy nową
                setTimeout(() => {
                    showRandomCharacter();
                }, 2000);

            } else {
                lives--;
                currentAttempt++;
                
                if (lives > 0) {
                    updateLivesDisplay();
                    document.getElementById('minifig-image').style.filter = `blur(${blurLevels[currentAttempt]}px)`;
                    displayMessage("Źle! Próbuj dalej.", true);
                } else {
                    updateLivesDisplay();
                    document.getElementById('minifig-image').style.filter = "blur(0px)"; // Pokazujemy po przegranej
                    displayMessage("Koniec szans! To było: " + currentAnswer.category, true);
                    
                    // Po przegranej czekamy 3 sekundy na przeładowanie
                    setTimeout(() => {
                        showRandomCharacter();
                    }, 3000);
                }
            }
        }
